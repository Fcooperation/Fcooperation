<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>View Note</title>

  <link
    rel="stylesheet"
    href="/view-note.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >

</head>

<body>

  <!-- =========================
       TOP BAR
  ========================= -->

  <div id="top">

    <button id="back-btn">
      ←
    </button>

    <div>

      <div id="top-title">
        FSTUDY NOTES
      </div>

      <div id="top-subtitle">
        Loading...
      </div>

    </div>

  </div>


  <!-- =========================
       NOTE IMAGE PREVIEW
  ========================= -->

  <div
    id="note-preview-container"
    class="note-preview-container hidden"
  >

    <button
      id="note-preview-btn"
      class="note-preview-btn"
      type="button"
      aria-label="Open study material"
    >

      <img
        id="note-preview-image"
        class="note-preview-image"
        alt="Study material preview"
      >

      <span class="note-preview-label">
        View material
      </span>

    </button>

  </div>


  <!-- =========================
       NOTE IMAGE OVERLAY
  ========================= -->

  <div
    id="note-image-overlay"
    class="note-image-overlay hidden"
  >

    <div class="note-image-overlay-content">

      <!-- TOP BAR -->

      <div class="note-image-overlay-top">

        <span id="note-image-page">
          Page 1
        </span>

        <button
          id="note-image-cancel"
          class="note-image-cancel"
          type="button"
        >
          Cancel
        </button>

      </div>


      <!-- IMAGE AREA -->

      <div
        id="note-image-viewer"
        class="note-image-viewer"
      >

        <img
          id="note-overlay-image"
          class="note-overlay-image"
          alt="Study material"
          draggable="false"
        >

      </div>


      <!-- CONTROLS -->

      <div class="note-image-controls">

        <button
          id="note-image-zoom-out"
          type="button"
          class="note-image-control"
        >
          −
        </button>

        <button
          id="note-image-zoom-reset"
          type="button"
          class="note-image-control"
        >
          Reset
        </button>

        <button
          id="note-image-zoom-in"
          type="button"
          class="note-image-control"
        >
          +
        </button>

        <button
          id="note-image-next"
          type="button"
          class="note-image-next"
        >
          Next
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       LOADING
  ========================= -->

  <div id="loading">

    <div class="loader"></div>

    <p>
      Loading note...
    </p>

  </div>


  <!-- =========================
       ERROR
  ========================= -->

  <div
    id="error"
    class="hidden"
  >
    Failed to load note.
  </div>


  <!-- =========================
       NOTE
  ========================= -->

  <main
    id="note"
    class="hidden"
  >

    <!-- NOTE HEADER -->

    <section class="note-header">

      <div
        id="note-topic"
        class="note-topic"
      ></div>

      <h1 id="note-title"></h1>

      <div
        id="note-meta"
        class="note-meta"
      ></div>

    </section>


    <!-- SECTIONS -->

    <div id="sections"></div>

  </main>


  <script src="/config.js"></script>

  <script src="/view-note.js"></script>

</body>

</html>
