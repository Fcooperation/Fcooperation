<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FMarket - Me</title>

  <link
    rel="stylesheet"
    href="fmarket-me.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >

</head>

<body>

  <div class="app">


    <!-- =========================
         HEADER
    ========================= -->

    <header class="topbar">

      <div class="brand-area">

        <div class="brand">
          FMARKET
        </div>

        <div class="brand-subtitle">
          My account
        </div>

      </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main-content">


      <!-- =========================
           USER
      ========================= -->

      <section class="user-section">

        <div class="user-avatar">
          ◯
        </div>

        <div class="user-info">

          <div class="user-label">
            Welcome back
          </div>

          <div
            class="username"
            id="username"
          >
            Loading...
          </div>

        </div>

      </section>


      <!-- =========================
           FCOINS
      ========================= -->

      <section class="balance-card">

        <div class="balance-left">

          <div class="balance-label">
            Your FCoins
          </div>

          <div
            class="balance-value"
            id="balance-value"
          >
            0
          </div>

          <div class="balance-subtitle">
            Available balance
          </div>

        </div>


        <div class="balance-icon">
          ₣
        </div>

      </section>


      <!-- =========================
           ACCOUNT ACTIONS
      ========================= -->

      <section class="actions-section">

        <div class="section-heading">

          <h2>
            FMarket
          </h2>

        </div>


        <!-- TOP UP -->

        <button
          type="button"
          class="action-card"
          id="topup-btn"
        >

          <div class="action-icon">
            ₣
          </div>

          <div class="action-content">

            <div class="action-title">
              Top Up FCoins
            </div>

            <div class="action-description">
              Add FCoins to your balance.
            </div>

          </div>

          <div class="action-arrow">
            ›
          </div>

        </button>


        <!-- SELL -->

        <button
          type="button"
          class="action-card"
          id="sell-btn"
        >

          <div class="action-icon">
            +
          </div>

          <div class="action-content">

            <div class="action-title">
              Sell a Material
            </div>

            <div class="action-description">
              Sell notes, books, handouts and more.
            </div>

          </div>

          <div class="action-arrow">
            ›
          </div>

        </button>

      </section>


    </main>


    <!-- =========================
         BOTTOM NAV
    ========================= -->

    <nav class="bottom-nav">


      <a
        href="/fmarket"
        class="nav-item"
      >

        <span class="nav-icon">
          ⌂
        </span>

        <span class="nav-label">
          Home
        </span>

      </a>


      <a
        href="/fmarket-inbox"
        class="nav-item"
      >

        <span class="nav-icon">
          💬
        </span>

        <span class="nav-label">
          Inbox
        </span>

      </a>


      <a
        href="/fmarket-orders"
        class="nav-item"
      >

        <span class="nav-icon">
          🛍️
        </span>

        <span class="nav-label">
          Orders
        </span>

      </a>


      <a
        href="/fmarket-me"
        class="nav-item active"
      >

        <span class="nav-icon">
          ◯
        </span>

        <span class="nav-label">
          Me
        </span>

      </a>


    </nav>

  </div>


  <script src="fmarket-me.js"></script>

</body>

</html>
