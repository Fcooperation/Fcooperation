<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FMarket</title>

  <link
    rel="stylesheet"
    href="fmarket.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >

</head>

<body>

  <!-- =========================
       APP
  ========================= -->

  <div class="app">


    <!-- =========================
         HEADER
    ========================= -->

    <header class="topbar">

      <div class="brand-area">

        <div class="brand">
          FMARKET
        </div>

        <div class="brand-subtitle">
          Student marketplace
        </div>

      </div>


      <button
        type="button"
        class="sell-btn"
        id="sell-btn"
      >
        + Sell
      </button>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main-content">


      <!-- =========================
           BALANCE
      ========================= -->

     <section class="balance-card">

  <div class="balance-left">

    <div class="balance-label">
      Your FCoins
    </div>

    <div
      class="balance-value"
      id="balance-value"
    >
      0
    </div>

    <div
      class="balance-naira"
      id="balance-naira"
    >
      ₦0
    </div>

    <div class="balance-subtitle">
      Available balance
    </div>

  </div>


  <div class="balance-right">

    <button
  type="button"
  class="balance-eye"
  id="balance-eye"
  aria-label="Hide balance"
>
  <svg
    class="eye-icon"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle
      cx="12"
      cy="12"
      r="3"
      stroke="currentColor"
      stroke-width="2"
    />
  </svg>
</button>

    <div class="balance-icon">
      ₣
    </div>

  </div>

</section>


      <!-- =========================
           SEARCH
      ========================= -->

      <section class="search-section">

        <div class="search-box">

          <span class="search-icon">
            ⌕
          </span>

          <input
            type="search"
            id="search-input"
            placeholder="Search notes, books, past questions..."
            autocomplete="off"
          >

        </div>

      </section>


      <!-- =========================
           CATEGORIES
      ========================= -->

      <section class="categories-section">

        <div class="section-heading">

          <h2>
            Explore
          </h2>

        </div>


        <div class="categories">

          <button
            class="category-card active"
            data-category="all"
          >
            <span class="category-icon">
              🛍️
            </span>

            <span>
              All
            </span>
          </button>

<button
  class="category-card"
  data-category="notes"
>
  <span class="category-icon">📝</span>
  <span>Notes</span>
</button>

<button
  class="category-card"
  data-category="past_questions"
>
  <span class="category-icon">📄</span>
  <span>Past Qs</span>
</button>

<button
  class="category-card"
  data-category="textbook"
>
  <span class="category-icon">📚</span>
  <span>Textbooks</span>
</button>

<button
  class="category-card"
  data-category="handout"
>
  <span class="category-icon">📑</span>
  <span>Handouts</span>
</button>

        </div>

      </section>


      <!-- =========================
           PRODUCTS
      ========================= -->

      <section class="products-section">

        <div class="section-heading">

          <h2>
            Discover
          </h2>

          <button
            type="button"
            id="see-all-btn"
          >
            See all
          </button>

        </div>

<div
  id="product-grid"
  class="product-grid"
>
</div>


        <!-- EMPTY SEARCH -->

        <div
          id="empty-search"
          class="empty-search hidden"
        >

          <div>
            🔎
          </div>

          <h3>
            Nothing found
          </h3>

          <p>
            Try searching for another material.
          </p>

        </div>

      </section>


    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================= -->

    <nav class="bottom-nav">

      <a
        href="/fmarket"
        class="nav-item active"
      >

        <span class="nav-icon">
          ⌂
        </span>

        <span class="nav-label">
          Home
        </span>

      </a>


      <a
        href="/fmarket-inbox"
        class="nav-item"
      >

        <span class="nav-icon">
          💬
        </span>

        <span class="nav-label">
          Inbox
        </span>

      </a>


      <a
        href="/fmarket-orders"
        class="nav-item"
      >

        <span class="nav-icon">
          🛍️
        </span>

        <span class="nav-label">
          Orders
        </span>

      </a>


      <a
        href="/fmarket-me"
        class="nav-item"
      >

        <span class="nav-icon">
          ◯
        </span>

        <span class="nav-label">
          Me
        </span>

      </a>

    </nav>

  </div>


  <script src="fmarket.js"></script>

</body>

</html>
