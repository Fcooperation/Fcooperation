<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FMarket Backend Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    pre {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: red;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <h2>FMarket Backend Test</h2>

  <button onclick="testFMarket()">
    Test /fmarket
  </button>

  <div
    id="info"
    class="box"
  >
    Waiting...
  </div>

  <h3>Full Backend Response</h3>

  <pre id="output">
Nothing yet.
  </pre>


  <script>

    async function testFMarket() {

      const info =
        document.getElementById(
          "info"
        );

      const output =
        document.getElementById(
          "output"
        );


      info.innerHTML =
        "⏳ Calling /fmarket...";

      output.textContent =
        "Loading...";


      /*
        =========================
        GET ACCOUNT
        =========================
      */

      let account;

      try {

        account =
          JSON.parse(
            localStorage.getItem(
              "faccount"
            )
          );

      } catch (error) {

        info.innerHTML =
          "<span class='error'>❌ Invalid faccount in localStorage.</span>";

        output.textContent =
          error.message;

        return;
      }


      if (!account) {

        info.innerHTML =
          "<span class='error'>❌ No faccount found in localStorage.</span>";

        output.textContent =
          "localStorage.getItem('faccount') returned null.";

        return;
      }


      const userId =
        account.id;


      if (!userId) {

        info.innerHTML =
          "<span class='error'>❌ faccount exists but account.id is missing.</span>";

        output.textContent =
          JSON.stringify(
            account,
            null,
            2
          );

        return;
      }


      /*
        =========================
        CALL BACKEND
        =========================
      */

      try {

        const response =
          await fetch(
            "https://fweb-backend.onrender.com/fmarket",
            {
              method: "GET",
              headers: {
                "Content-Type":
                  "application/json",

                "x-user-id":
                  userId
              }
            }
          );


        const text =
          await response.text();


        let data;

        try {

          data =
            JSON.parse(text);

        } catch (error) {

          info.innerHTML =
            "<span class='error'>❌ Backend did not return JSON.</span>";

          output.textContent =
            text;

          return;
        }


        /*
          =========================
          SHOW BASIC RESULT
          =========================
        */

        info.innerHTML = `
          <strong>Status:</strong>
          ${response.status}
          <br><br>

          <strong>User ID:</strong>
          ${userId}
          <br><br>

          <strong>Success:</strong>
          ${data.success}
          <br><br>

          <strong>Materials:</strong>
          ${
            Array.isArray(
              data.materials
            )
              ? data.materials.length
              : "Not an array"
          }
        `;


        /*
          =========================
          FIND BIO101
          =========================
        */

        if (
          Array.isArray(
            data.materials
          )
        ) {

          const bio101 =
            data.materials.find(
              item =>
                String(
                  item.id
                ) ===
                "1a5ac598-cdfe-482a-bb0d-dc32eb5d93af"
            );


          if (bio101) {

            info.innerHTML += `

              <hr>

              <strong>BIO101 FOUND</strong>

              <br><br>

              <strong>Title:</strong>
              ${bio101.title}

              <br>

              <strong>Category:</strong>
              ${bio101.category}

              <br>

              <strong>Material Type:</strong>
              ${bio101.material_type}

              <br>

              <strong>Owned:</strong>
              ${bio101.owned}

              <br>

              <strong>Price:</strong>
              ${bio101.price}

              <br>

              <strong>File URL:</strong>
              ${
                bio101.file_url ??
                "❌ NULL / UNDEFINED"
              }

            `;

          } else {

            info.innerHTML += `

              <hr>

              ❌ BIO101 was not found
              in the returned materials.

            `;

          }

        }


        /*
          =========================
          FULL RESPONSE
          =========================
        */

        output.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


      } catch (error) {

        info.innerHTML =
          "<span class='error'>❌ Request failed.</span>";

        output.textContent =
          error.message;

      }

    }


    /*
      Automatically run test
    */

    testFMarket();

  </script>

</body>

</html>
