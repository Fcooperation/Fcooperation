<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FMarket Backend Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    .box {
      background: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    pre {
      background: #111;
      color: #eee;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

  </style>

</head>


<body>

  <h2>FMarket Backend Test</h2>

  <button onclick="testBackend()">
    Test /fmarket
  </button>

  <div id="info"></div>

  <h3>Raw Backend Response</h3>

  <pre id="output">
Waiting...
  </pre>


  <script>

    async function testBackend() {

      const info =
        document.getElementById(
          "info"
        );

      const output =
        document.getElementById(
          "output"
        );


      info.innerHTML =
        "⏳ Calling backend...";

      output.textContent =
        "Loading...";


      /*
       * =========================
       * GET USER ID
       * =========================
       */

      const accountRaw =
        localStorage.getItem(
          "faccount"
        );


      if (!accountRaw) {

        info.innerHTML =
          "❌ No faccount found in localStorage.";

        output.textContent =
          "localStorage.getItem('faccount') returned null.";

        return;

      }


      let account;

      try {

        account =
          JSON.parse(
            accountRaw
          );

      } catch (error) {

        info.innerHTML =
          "❌ faccount is not valid JSON.";

        output.textContent =
          accountRaw;

        return;

      }


      const userId =
        account.id;


      if (!userId) {

        info.innerHTML =
          "❌ faccount exists, but account.id is missing.";

        output.textContent =
          JSON.stringify(
            account,
            null,
            2
          );

        return;

      }


      /*
       * =========================
       * CALL BACKEND
       * =========================
       */

      try {

        const response =
          await fetch(
            "https://fweb-backend.onrender.com/fmarket",
            {
              method: "GET",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  userId: userId
                })
            }
          );


        const text =
          await response.text();


        let data;

        try {

          data =
            JSON.parse(
              text
            );

        } catch (error) {

          info.innerHTML =
            "❌ Backend did not return valid JSON.";

          output.textContent =
            text;

          return;

        }


        /*
         * =========================
         * DISPLAY BASIC INFO
         * =========================
         */

        let html = `

          <div class="box">
            <span class="label">
              User ID:
            </span>

            ${userId}
          </div>

          <div class="box">
            <span class="label">
              HTTP Status:
            </span>

            ${response.status}
          </div>

          <div class="box">
            <span class="label">
              Success:
            </span>

            ${data.success}
          </div>

        `;


        /*
         * =========================
         * FIND BIO101
         * =========================
         */

        const materials =
          data.materials || [];


        const bio101 =
          materials.find(
            item =>
              String(
                item.id
              ) ===
              "1a5ac598-cdfe-482b-bb0d-dc32eb5d93af"
          );


        if (bio101) {

          html += `

            <div class="box">

              <div>
                <span class="label">
                  BIO101 found:
                </span>

                ✅ YES
              </div>

              <br>

              <div>
                <span class="label">
                  Category:
                </span>

                ${bio101.category ?? "undefined"}
              </div>

              <div>
                <span class="label">
                  Material Type:
                </span>

                ${bio101.material_type ?? "undefined"}
              </div>

              <div>
                <span class="label">
                  Price:
                </span>

                ${bio101.price ?? "undefined"}
              </div>

              <div>
                <span class="label">
                  Owned:
                </span>

                ${bio101.owned ?? "undefined"}
              </div>

              <div>
                <span class="label">
                  File URL:
                </span>

                ${
                  bio101.file_url ||
                  "❌ MISSING / NULL / EMPTY"
                }

              </div>

            </div>

          `;

        } else {

          html += `

            <div class="box">

              <span class="label">
                BIO101:
              </span>

              ❌ Not found in materials

            </div>

          `;

        }


        info.innerHTML =
          html;


        /*
         * =========================
         * FULL RESPONSE
         * =========================
         */

        output.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


      } catch (error) {

        info.innerHTML =
          "❌ Request failed.";

        output.textContent =
          error.message;

      }

    }


    // Run automatically
    testBackend();

  </script>

</body>

</html>
