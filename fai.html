<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study FAI</title>
<link rel="stylesheet" href="fai.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head><body><div id="top-bar">  <h2>Study FAI</h2>  <div><button id="new-chat-btn">+</button>

<div id="fai-notice" class="fai-notice hidden">
  ⚠️ Full FAI access is only available after signing in.  
  <a href="login.html">Sign in</a> to continue.
</div>

<button id="clear-btn">
  Delete
</button>

  </div></div><div id="chat-box"></div>
  <div id="input-area">
    
    <input
  type="file"
  id="camera-input"
  accept="image/*"
  capture="environment"
  hidden
>

<input
  type="file"
  id="photos-input"
  accept="image/*"
  hidden
>
<input
  type="file"
  id="files-input"
  hidden
>

  <button id="plus-btn" type="button">+</button>

  <div id="upload-menu">

    <button id="camera-btn" type="button">
      <span>▣</span>
      Camera
    </button>

    <button id="photos-btn" type="button">
      <span>▧</span>
      Photos
    </button>

    <button id="files-btn" type="button">
      <span>□</span>
      Files
    </button>

  </div>
<div id="image-preview"></div>
  <textarea
    id="prompt"
    placeholder="Ask a study question..."
    rows="1"
  ></textarea>

  <button id="send-btn" type="button">
    Send
  </button>

</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="fai.js"></script></body>
</html>
