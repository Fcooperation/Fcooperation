<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="FAI — your study assistant for questions, explanations, files, and image generation."
  >

  <title>Study FAI | FCOOPERATION</title>

  <link rel="stylesheet" href="fai.css">

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >
</head>

<body>

  <!-- TOP BAR -->

  <header id="top-bar">

    <h2>Study FAI</h2>

    <div>

      <button
        id="new-chat-btn"
        type="button"
        aria-label="Start a new chat"
        title="New chat"
      >
        +
      </button>

      <button
        id="clear-btn"
        type="button"
      >
        Delete
      </button>

    </div>

  </header>


  <!-- SIGN-IN NOTICE -->

  <div
    id="fai-notice"
    class="fai-notice hidden"
    role="status"
  >
    Full FAI access is available after signing in.

    <a href="login.html">
      Sign in
    </a>
    to continue.
  </div>


  <!-- CHAT MESSAGES -->

  <main
    id="chat-box"
    aria-label="FAI conversation"
    aria-live="polite"
  ></main>


  <!-- MESSAGE INPUT -->

  <form
    id="input-area"
    onsubmit="return false;"
  >

    <!-- IMAGE FILE INPUT -->

    <input
      type="file"
      id="photos-input"
      accept="image/*"
      hidden
    >

    <!-- GENERAL FILE INPUT -->

    <input
      type="file"
      id="files-input"
      hidden
    >


    <!-- FEATURE MENU BUTTON -->

    <button
      id="plus-btn"
      type="button"
      aria-label="Open attachments and features"
      aria-controls="upload-menu"
      title="Attachments and features"
    >
      +
    </button>


    <!-- FEATURE MENU -->

    <div
      id="upload-menu"
      role="menu"
    >

      <button
        id="photos-btn"
        type="button"
        role="menuitem"
      >
        <span aria-hidden="true">▧</span>
        Photos
      </button>

      <button
        id="files-btn"
        type="button"
        role="menuitem"
      >
        <span aria-hidden="true">□</span>
        Files
      </button>

      <button
        id="generate-image-btn"
        type="button"
        role="menuitem"
      >
        <span aria-hidden="true">✦</span>
        Generate image
      </button>

    </div>


    <!-- ATTACHMENT PREVIEW -->

    <div
      id="image-preview"
      aria-label="Attachment preview"
    ></div>


    <!-- NORMAL FAI INPUT -->

    <textarea
      id="prompt"
      placeholder="Ask a study question..."
      rows="1"
      aria-label="Ask FAI a question"
    ></textarea>


    <!-- IMAGE GENERATION MODE -->

    <section
      id="image-generation-mode"
      aria-label="Image generation"
    >

      <div class="image-generation-header">

        <div class="image-generation-title">
          <span aria-hidden="true">✦</span>
          Generate image
        </div>

        <button
          id="cancel-image-generation"
          type="button"
        >
          Cancel
        </button>

      </div>


      <div class="image-generation-body">

        <textarea
          id="image-generation-prompt"
          placeholder="Describe your image..."
          rows="1"
          aria-label="Describe the image to generate"
        ></textarea>

        <button
          id="image-edit-upload-btn"
          type="button"
        >
          Add image
        </button>

      </div>

    </section>


    <!-- SEND -->

    <button
      id="send-btn"
      type="button"
    >
      Send
    </button>

  </form>


  <!-- MARKDOWN SUPPORT -->

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- FAI LOGIC -->

  <script src="fai.js"></script>

</body>
</html>
