<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fweb</title>

  <link rel="stylesheet" href="fweb.css">
</head>

<body>

  <main class="fweb">

    <h1 id="fwebTitle">FWEB</h1>

    <div class="search-area" id="searchArea">
      <input
        type="text"
        id="searchInput"
        placeholder="Search the web..."
        autocomplete="off"
      >

      <button id="searchButton">
        Search
      </button>
    </div>

    <div class="search-results" id="searchResults">

      <div class="tabs">
        <button class="tab active">Web</button>
      </div>

    </div>

  </main>

  <script src="config.js"></script>
<script src="fweb.js"></script>
</body>
</html>
