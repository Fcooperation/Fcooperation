<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faccount Test</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f7fa;
    }

    pre {
      background: white;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .found {
      color: green;
      font-weight: bold;
    }

    .missing {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>faccount Test</h2>

  <div id="status"></div>

  <h3>Raw faccount:</h3>
  <pre id="raw"></pre>

  <h3>Detected ID:</h3>
  <pre id="id"></pre>

  <script>

    const raw = localStorage.getItem("faccount");

    const rawEl = document.getElementById("raw");
    const idEl = document.getElementById("id");
    const statusEl = document.getElementById("status");

    if (!raw) {

      statusEl.innerHTML =
        `<p class="missing">❌ No "faccount" found in localStorage.</p>`;

      rawEl.textContent = "null";
      idEl.textContent = "No ID";

    } else {

      rawEl.textContent = raw;

      try {

        const account = JSON.parse(raw);

        const userId =
          account?.userId ||
          account?.user_id ||
          account?.id ||
          account?.uid;

        if (userId) {

          statusEl.innerHTML =
            `<p class="found">✅ Account found</p>`;

          idEl.textContent =
            `Detected ID: ${userId}`;

        } else {

          statusEl.innerHTML =
            `<p class="missing">❌ Account found, but no ID detected.</p>`;

          idEl.textContent =
            "Checked: userId, user_id, id, uid";

        }

      } catch (error) {

        statusEl.innerHTML =
          `<p class="missing">❌ faccount exists but is not valid JSON.</p>`;

        idEl.textContent = error.message;

      }

    }

  </script>

</body>
</html>
