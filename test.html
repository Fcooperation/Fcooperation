<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FMarket Material Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 15px;
    }

    pre {
      background: white;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .field {
      background: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .label {
      font-weight: bold;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h2>FMarket Material Test</h2>

  <button onclick="checkMaterial()">
    Check localStorage
  </button>

  <div id="fields"></div>

  <h3>Full Stored Object</h3>

  <pre id="output">
Nothing checked yet.
  </pre>


  <script>

    function checkMaterial() {

      const raw =
        localStorage.getItem(
          "fmarket_material"
        );

      const fields =
        document.getElementById(
          "fields"
        );

      const output =
        document.getElementById(
          "output"
        );

      if (!raw) {

        fields.innerHTML =
          "<div class='field'>❌ No fmarket_material found in localStorage.</div>";

        output.textContent =
          "localStorage.getItem('fmarket_material') returned null.";

        return;
      }


      let material;

      try {

        material =
          JSON.parse(raw);

      } catch (error) {

        fields.innerHTML =
          "<div class='field'>❌ fmarket_material exists but is not valid JSON.</div>";

        output.textContent =
          raw;

        return;
      }


      fields.innerHTML = `

        <div class="field">
          <span class="label">ID:</span>
          ${material.id ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">Title:</span>
          ${material.title ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">Category:</span>
          ${material.category ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">Material Type:</span>
          ${material.material_type ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">Owned:</span>
          ${material.owned ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">Price:</span>
          ${material.price ?? "undefined"}
        </div>

        <div class="field">
          <span class="label">File URL:</span>
          ${material.file_url ?? "❌ undefined / missing"}
        </div>

      `;


      output.textContent =
        JSON.stringify(
          material,
          null,
          2
        );

    }


    // Automatically check when page opens
    checkMaterial();

  </script>

</body>

</html>
