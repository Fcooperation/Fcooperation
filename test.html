<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FCHAT Storage Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    padding:20px;
}

pre{
    background:#222;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

</head>
<body>

<h2>FCHAT Local Storage</h2>

<pre id="output"></pre>

<script>

const data =
JSON.parse(
localStorage.getItem(
"fchat_messages"
)
);

document.getElementById(
"output"
).textContent =

JSON.stringify(
data,
null,
4
);

</script>

</body>
</html>
