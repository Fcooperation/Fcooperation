<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Courses API Test</title>
</head>

<body>

  <h2>Courses API Test</h2>

  <pre id="output">Loading...</pre>

  <script src="config.js"></script>

  <script>

    async function test() {

      const output =
        document.getElementById("output");

      try {

        const response = await fetch(
          window.CONFIG.API_URL + "/admin",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              action: "get_courses",
              university: "EBSU"
            })
          }
        );


        const data =
          await response.json();


        output.textContent =
          JSON.stringify(data, null, 2);


      } catch (error) {

        output.textContent =
          "ERROR:\n\n" + error.message;

      }

    }


    test();

  </script>

</body>

</html>
